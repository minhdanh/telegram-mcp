[package]
name = "telegram-mcp"
version = "0.1.0"
edition = "2021"
authors = ["Minh Danh"]
description = "Model Context Protocol (MCP) server for real-time Telegram channel monitoring"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
teloxide = { version = "0.17", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2.0"
futures-util = "0.3"
