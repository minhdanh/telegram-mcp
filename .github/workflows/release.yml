name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon macOS (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: telegram-mcp
            asset_name: telegram-mcp-aarch64-apple-darwin
          # Intel macOS
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: telegram-mcp
            asset_name: telegram-mcp-x86_64-apple-darwin
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: telegram-mcp
            asset_name: telegram-mcp-x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_VERSION=${TAG}" >> $GITHUB_ENV
          echo "Building release for ${TAG}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          STAGING="staging"
          mkdir -p "${STAGING}"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "${STAGING}/"
          cp README.md "${STAGING}/"
          cp config.yaml.example "${STAGING}/"

          ARCHIVE_NAME="${{ matrix.asset_name }}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C "${STAGING}" .

          # Generate SHA256 checksum
          if command -v shasum &> /dev/null; then
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi

          echo "ARCHIVE_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "CHECKSUM_PATH=${ARCHIVE_NAME}.sha256" >> $GITHUB_ENV

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.CHECKSUM_PATH }}
          draft: false
          prerelease: false
